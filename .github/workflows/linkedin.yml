name: LinkedIn Automation

permissions:
  contents: write

concurrency:
  group: linkedin-automation
  cancel-in-progress: false

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate LinkedIn Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_post.py

      - name: Upload Generated Post
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post
          path: output/posts/latest_post.txt

      - name: Generate Thumbnail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_thumbnail.py

      - name: Upload LinkedIn Image
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python scripts/upload_linkedin_image.py
      
      - name: Verify Asset Exists
        run: ls -R output/assets


      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python scripts/publish_linkedin.py
          
      - name: Update Topic Status
        run: python scripts/update_status.py 

      - name: Commit Updated Topics
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
      
          git add content/topics.json
      
          git commit -m "Update topic status" || echo "No changes"
      
          git push

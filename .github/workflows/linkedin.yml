name: LinkedIn Automation

on:
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate LinkedIn Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_post.py

      - name: Upload Generated Post
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-post
          path: output/posts/latest_post.txt

      - name: Generate Thumbnail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_thumbnail.py

      - name: Upload LinkedIn Image
        run: python scripts/upload_linkedin_image.py
      
      - name: Verify Asset Exists
        run: ls -R output/assets


      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python scripts/publish_linkedin.py
          
      - name: Update Topic Status
        run: python scripts/update_status.py 
